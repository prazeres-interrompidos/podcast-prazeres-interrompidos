name: Atualizar episódios e publicar
on:
  push:
    branches: [main, master]
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Obter RSS e gerar páginas
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/gerar.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
